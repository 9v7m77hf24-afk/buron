<!DOCTYPE html>
<html lang="fr">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Guide du Tournel</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/leburon.css">
  <link rel="stylesheet" href="./css/flore.css">
  <link rel="stylesheet" href="./css/gastro.css">
  <link rel="stylesheet" href="./css/guide.css">
  <link rel="icon" href="./img/logo.png" type="image/png"/>

</head>

<body>
  <!-- Startup splash overlay: covers the page until router.js confirms the
       home page is actually rendered and fonts are loaded (see router.js).
       Same background/logo as the native OS splash screen (manifest.json)
       so the handoff between them looks like one continuous launch. -->
  <div id="app-splash">
    <img src="./img/logo-512-v2.png" alt="" class="splash-logo">
  </div>

  <!-- Persistent background, never reloaded between pages -->
  <div class="background"></div>

  <header class="nav">
    <!--<a href="#" data-page="home" class="nav-logo-link" aria-label="Go to home"></a>-->
    <img src="./img/logo-192.png" alt="Logo" class="nav-logo">   
  </header>

  <main id="content">
      <!-- Page content gets injected here by router.js -->
  </main>

  <!-- Landscape-only home button; hidden entirely on the home screen -->
  <a href="#" data-page="home" class="home-fab" aria-label="Retour à l'accueil">
    <img src="./img/house.png" alt="" class="nav-icon">
  </a>

  <footer class="bottom-nav" id="bottomNav">
    <a href="#" data-page="home" class="nav-link">
      <img src="./img/house.png" alt="" class="nav-icon">
      <!--<span>Accueil</span>-->
    </a>
    <!--
    <a href="#" data-page="about" class="nav-link">Infos</a>
    -->
  </footer>

  <!-- Order matters -->
  <script src="./js/gallery-engine.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
